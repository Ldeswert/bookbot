services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    env_file:
      - /run/base44/app.env
    command: ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && exec python3 app.py"]
    environment:
      - PYTHONUNBUFFERED=1
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:3000/', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
